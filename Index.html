<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Deberes App</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: 'Roboto', sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding-bottom: 30px;
  }
  h1 {
    margin: 20px 0;
    color: #fff;
    text-shadow: 1px 1px 5px rgba(0,0,0,0.2);
  }
  form {
    background: #ffffffdd;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    width: 90%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  input, select, button {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 1rem;
  }
  input, select {
    outline: none;
  }
  button {
    background: #4e91fc;
    color: white;
    border: none;
    font-weight: 500;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover {
    background: #3b73d1;
  }
  ul {
    list-style: none;
    padding: 0;
    width: 90%;
    max-width: 400px;
    margin-top: 20px;
  }
  li {
    background: #fff;
    margin-bottom: 15px;
    padding: 15px;
    border-radius: 15px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
  }
  .detalle {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .tipo {
    font-weight: 500;
    color: #4e91fc;
  }
  .fecha {
    font-size: 0.85rem;
    color: #888;
  }
  .eliminar {
    background: #ff6b6b;
    border: none;
    padding: 8px 12px;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    transition: 0.2s;
  }
  .eliminar:hover {
    background: #e55050;
  }
</style>
</head>
<body>

<h1>Mis Deberes</h1>

<form id="formulario">
  <input type="text" id="descripcion" placeholder="Descripción de la tarea" required>
  <select id="tipo">
    <option value="Deber">Deber</option>
    <option value="Trabajo">Trabajo</option>
    <option value="Parcial">Parcial</option>
  </select>
  <input type="date" id="fecha" required>
  <button type="submit">Agregar</button>
</form>

<ul id="listaDeTareas"></ul>

<script>
const formulario = document.getElementById('formulario');
const listaDeTareas = document.getElementById('listaDeTareas');

let tareas = JSON.parse(localStorage.getItem('tareas')) || [];

function guardarTareas() {
  localStorage.setItem('tareas', JSON.stringify(tareas));
}

function mostrarTareas() {
  listaDeTareas.innerHTML = '';
  tareas.forEach((tarea, index) => {
    const li = document.createElement('li');
    li.innerHTML = `
      <div class="detalle">
        <span class="tipo">${tarea.tipo}</span>
        <span>${tarea.descripcion}</span>
        <span class="fecha">${tarea.fecha}</span>
      </div>
      <button class="eliminar" onclick="eliminarTarea(${index})">Eliminar</button>
    `;
    listaDeTareas.appendChild(li);
  });
}

function eliminarTarea(index) {
  tareas.splice(index, 1);
  guardarTareas();
  mostrarTareas();
}

formulario.addEventListener('submit', function(e) {
  e.preventDefault();
  const descripcion = document.getElementById('descripcion').value;
  const tipo = document.getElementById('tipo').value;
  const fecha = document.getElementById('fecha').value;

  tareas.push({ descripcion, tipo, fecha });
  guardarTareas();
  mostrarTareas();
  formulario.reset();
});

mostrarTareas();
</script>

</body>
  </html>
